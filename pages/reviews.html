<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reviews | Journovo</title>
  <link rel="stylesheet" href="/src/pages/reviews.css">
</head>
<body>
  <div data-navigation></div>
  <main class="page reviews-page">
    <header>
      <p class="eyebrow">COMMUNITY</p>
      <h1>Traveler reviews</h1>
      <p class="lead">Share a useful note from your latest journey.</p>
    </header>
    <form id="review-form" class="panel form" enctype="multipart/form-data">
      <div class="form-grid">
        <div class="field"><label>Review type</label><select name="type" required><option value="trip">Trip</option><option value="hotel">Hotel</option><option value="restaurant">Restaurant</option><option value="flight">Flight</option></select></div>
        <div class="field"><label>Item ID</label><input name="reviewable_id" type="text" maxlength="500" required><small>Use the trip, hotel, restaurant, or flight ID shown in its details.</small></div>
        <div class="field"><label>Rating</label><select name="rating" required><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select></div>
      </div>
      <div class="field"><label>Review</label><textarea name="description" rows="5" required maxlength="2000"></textarea></div>
      <div class="field"><label>Photo (optional)</label><input name="image" type="file" accept="image/png,image/jpeg"></div>
      <button class="button">Submit review</button>
    </form>
    <div id="reviews" class="results"><div class="empty">Loading reviews…</div></div>
  </main>
  <script src="/config.js"></script>
  <script type="module" src="/src/pages/reviews.js"></script>
</body>
</html>
