<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reviews | Journovo</title>
  <link rel="stylesheet" href="/src/pages/reviews.css">
</head>
<body>
  <div data-navigation></div>
  <main class="page reviews-page">
    <header>
      <p class="eyebrow">COMMUNITY</p>
      <h1>Traveler reviews</h1>
      <p class="lead">Share a useful note from your latest journey.</p>
    </header>
    <div id="review-prompt" class="panel" hidden></div>
    <form id="review-form" class="panel form" enctype="multipart/form-data">
      <input name="type" type="hidden">
      <input name="reviewable_id" type="hidden">
      <div class="form-heading">
        <p class="eyebrow">YOUR REVIEW</p>
        <h2 id="review-context">Write a review</h2>
      </div>
      <div id="item-picker-field" class="field" hidden>
        <label>Select trip or booking to review</label>
        <select id="item-select" name="item_select">
          <option value="">Loading your travel items…</option>
        </select>
      </div>
      <div class="field"><label>Rating</label><div class="star-rating" role="radiogroup" aria-label="Rating"><input type="radio" name="rating" value="5" id="star5" required hidden><label for="star5" class="star" aria-label="5 stars — Excellent">&#9733;</label><input type="radio" name="rating" value="4" id="star4" hidden><label for="star4" class="star" aria-label="4 stars — Very good">&#9733;</label><input type="radio" name="rating" value="3" id="star3" hidden><label for="star3" class="star" aria-label="3 stars — Good">&#9733;</label><input type="radio" name="rating" value="2" id="star2" hidden><label for="star2" class="star" aria-label="2 stars — Fair">&#9733;</label><input type="radio" name="rating" value="1" id="star1" hidden><label for="star1" class="star" aria-label="1 star — Poor">&#9733;</label></div></div>
      <div class="field"><label>Review</label><textarea name="description" rows="5" required maxlength="2000" placeholder="Tell other travelers about your experience…"></textarea><small><span data-count>0</span> / 2000</small></div>
      <div class="field"><label>Photo (optional)</label><input name="image" type="file" accept="image/png,image/jpeg"></div>
      <button class="button">Submit review</button>
    </form>
    <div id="reviews" class="results"><div class="empty">Loading reviews…</div></div>
  </main>
  <script src="/config.js"></script>
  <script type="module" src="/src/pages/reviews.js"></script>
</body>
</html>
