<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Journovo</title><link rel="stylesheet" href="../vendor/leaflet/leaflet.css"><link rel="stylesheet" href="../src/pages/register.css"></head><body><div data-navigation></div><main class="page register"><section><div class="eyebrow">START YOUR JOURNEY</div><h1>Create your Journovo account</h1><p class="lead">Choose your location on the map to personalize nearby travel ideas.</p></section><form id="register-form" class="panel form"><div class="form-grid"><div class="field"><label>First name</label><input name="first_name" required autocomplete="given-name" placeholder="First name"></div><div class="field"><label>Last name</label><input name="last_name" required autocomplete="family-name" placeholder="Last name"></div><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Phone</label><input name="phone" required autocomplete="tel" placeholder="+20 000 000 0000"></div><div class="field"><label>Birth date</label><input name="birth_date" type="date" required autocomplete="bday"></div><div class="field"><label>Password</label><div class="password-wrapper"><input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="8+ characters"><button type="button" class="password-toggle" aria-label="Show password" data-password-toggle><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="field"><label>Confirm password</label><div class="password-wrapper"><input name="password_confirmation" type="password" minlength="8" required autocomplete="new-password" placeholder="Re-enter password"><button type="button" class="password-toggle" aria-label="Show password" data-password-toggle><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div></div><div><label><b>Your location</b></label><p class="map-help">Click the map to set your location.</p><div id="location-map" class="map"></div><input type="hidden" name="longitude"><input type="hidden" name="latitude"></div><label><input type="checkbox" required> I agree to the terms and privacy policy.</label><button class="button">Create account</button><p>Already registered? <a href="./login.html">Sign in</a></p></form></main><script src="../vendor/leaflet/leaflet.js"></script><script src="../config.js"></script><script type="module" src="../src/pages/register.js"></script></body></html>
