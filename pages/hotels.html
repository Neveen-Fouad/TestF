<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotels | Journovo</title><link rel="stylesheet" href="/src/pages/hotels.css"></head><body><div data-navigation></div><main class="page search-page"><p class="eyebrow">STAYS</p><h1>Find a stay that fits.</h1><p class="lead">Search the live hotel provider with your destination and travel dates.</p><form id="search" class="panel search-form"><div class="search-grid"><div class="field"><label>Destination / Country</label><input name="destination" required placeholder="e.g. Paris, France"></div><div class="field"><label>Check-in</label><input name="check_in" type="date" required></div><div class="field"><label>Check-out</label><input name="check_out" type="date" required></div><div class="field"><label>Guests</label><input name="guests" type="number" min="1" value="2" required></div><div class="field"><label>Budget (USD)</label><input name="budget" type="number" min="1" placeholder="200" required></div><div class="field"><label>Sort order</label><select name="sort_order"><option value="REVIEW">Guest rating</option><option value="PRICE">Price</option><option value="popularity">Popularity</option></select></div></div><button class="button">Search hotels</button></form><div id="hotels" class="results"><div class="empty">Enter your destination and dates to search for hotels.</div></div></main><script type="module" src="/src/pages/hotels.js"></script></body></html>
