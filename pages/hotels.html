<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotels | Journovo</title><link rel="stylesheet" href="/src/pages/hotels.css"></head><body><div data-navigation></div><main class="page search-page"><p class="eyebrow">STAYS</p><h1>Find a stay that fits.</h1><p class="lead">Search live hotel inventory by destination, dates, guests, and budget.</p><form id="search" class="panel search-form"><div class="search-grid"><div class="field"><label>Destination</label><input name="destination" required minlength="2" placeholder="Istanbul"></div><div class="field"><label>Check-in</label><input name="check_in" type="date" required></div><div class="field"><label>Check-out</label><input name="check_out" type="date" required></div><div class="field"><label>Guests</label><input name="guests" type="number" min="1" max="20" value="2" required></div><div class="field"><label>Maximum budget</label><input name="budget" type="number" min="1" value="1000" required></div><div class="field"><label>Sort by</label><select name="sort_by"><option value="review">Guest rating</option><option value="price_low">Lowest price</option><option value="price_high">Highest price</option></select></div></div><button class="button">Search hotels</button></form><div class="panel-heading"><h2>Hotel results</h2><a id="compare-link" class="button subtle" href="/pages/compare.html">Compare selected (<span id="compare-count">0</span>)</a></div><div id="hotels" class="results"><div class="empty">Enter your stay details to load live hotel options.</div></div></main><script src="/config.js"></script><script type="module" src="/src/pages/hotels.js"></script></body></html>
