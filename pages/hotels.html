<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotels | Journovo</title><link rel="stylesheet" href="/src/pages/hotels.css"></head><body><div data-navigation></div><main class="page search-page"><p class="eyebrow">STAYS</p><h1>Find a stay that fits.</h1><p class="lead">Search the live hotel provider with the trip details it requires.</p><form id="search" class="panel search-form"><div class="search-grid"><div class="field"><label>Region ID</label><input name="region_id" type="number" min="1" required placeholder="Provider region ID"></div><div class="field"><label>Check-in</label><input name="checkin_date" type="date" required></div><div class="field"><label>Check-out</label><input name="checkout_date" type="date" required></div><div class="field"><label>Guests</label><input name="adults_number" type="number" min="1" value="2" required></div><div class="field"><label>Domain</label><input name="domain" value="US" required></div><div class="field"><label>Locale</label><input name="locale" value="en-US" required></div><div class="field"><label>Sort order</label><select name="sort_order"><option value="popularity">Popularity</option><option value="price">Price</option><option value="review_score">Guest rating</option></select></div><div class="field"><label>Page</label><input name="page_number" type="number" min="1" value="1"></div></div><button class="button">Search hotels</button></form><div id="hotels" class="results"><div class="empty">Enter your stay details to load live hotel options.</div></div></main><script type="module" src="/src/pages/hotels.js"></script></body></html>
