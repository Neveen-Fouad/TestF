<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse Journovo's ready-made travel itineraries.">
  <title>Premade trips | Journovo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/pages/home.css">
  <link rel="stylesheet" href="/src/pages/premade-trips.css">

<body>
  <div data-navigation></div>
  <main class="premade-trips-page">
    <section class="home-shell premade-trips-hero">

      <p>Explore every curated Journovo itinerary, then open one to see its day-by-day plan.</p>

    <section class="home-shell home-section premade-trips-section" aria-labelledby="premade-trips-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CURATED FOR YOU</p>

        </div>

      <div id="premade-trips" class="trip-grid" aria-live="polite">

    </section>

  <footer class="footer">© 2026 Journovo. Make every journey yours.</footer>
