<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live travel inventory | Journovo</title>
  <link rel="stylesheet" href="/src/pages/admin.css">
</head>
<body data-admin-page="live-inventory">
  <main class="page split admin-shell">
    <div data-admin-sidebar></div>
    <section class="admin-main">
      <header class="admin-heading">
        <div>
          <p class="eyebrow">ADMINISTRATION</p>
          <h1>Live travel inventory</h1>
          <p>Browse live external hotel, restaurant, and flight data on demand.</p>
        </div>
        <button class="button subtle" id="refresh-inventory" type="button">Refresh category</button>
      </header>
      <div id="inventory-warning" class="admin-warning" hidden></div>

      <nav class="inventory-tabs" aria-label="Inventory categories">
        <button class="tab-button active" type="button" data-tab="hotels">🏨 Hotels</button>
        <button class="tab-button" type="button" data-tab="restaurants">🍽️ Restaurants</button>
        <button class="tab-button" type="button" data-tab="flights">✈️ Flights</button>
      </nav>

      <section class="admin-inventory-section">
        <div class="admin-section-heading">
          <div>
            <h2 id="category-title">Hotels</h2>
            <p id="category-subtitle">Cairo, Alexandria, Istanbul, Dubai, and Paris · next available stay</p>
          </div>
          <strong id="inventory-count">0</strong>
        </div>
        <div id="inventory-results" class="results">
          <div class="empty">Loading inventory…</div>
        </div>
        <div id="pagination-controls" class="pagination-controls"></div>
      </section>
    </section>
  </main>
  <script src="/config.js"></script>
  <script type="module" src="/src/pages/admin-inventory.js"></script>
</body>
</html>
