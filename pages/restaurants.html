<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restaurants | Journovo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/pages/restaurants.css">
</head>
<body>
  <div data-navigation></div>
  <main class="page search-page">
    <p class="eyebrow">FOOD &amp; LOCAL LIFE</p>
    <h1>Save room for somewhere good.</h1>
    <p class="lead">Search real restaurant options for the city you are heading to.</p>
    <form id="restaurant-search" class="panel search-form">
      <div class="search-grid restaurant-grid row g-3">
        <div class="field col-12 col-md-6">
          <label>City</label>
          <input name="city" required placeholder="e.g. Cairo" autocomplete="address-level2">
        </div>
        <div class="field col-12 col-md-6">
          <label>Minimum rating</label>
          <select name="min_rating">
            <option value="">Any rating</option>
            <option value="5">5 stars</option>
            <option value="4">4 stars and up</option>
            <option value="3">3 stars and up</option>
          </select>
        </div>
      </div>
      <button class="button mt-3" type="submit">Find restaurants</button>
    </form>
    <div id="restaurants" class="results mt-4">
      <div class="empty">Choose a city to discover restaurant options.</div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script src="/config.js"></script>
  <script type="module" src="/src/pages/restaurants.js"></script>
</body>
</html>
