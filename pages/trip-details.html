<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trip details | Journovo</title>
  <link rel="stylesheet" href="/src/pages/trip-details.css">
</head>
<body>
  <div data-navigation></div>
  <main class="page">
    <section id="trip" class="panel">Loading trip…</section>
    <form id="trip-form" class="panel form" hidden>
      <div class="form-grid">
        <div class="field"><label>Destination</label><input name="destination" required></div>
        <div class="field"><label>Travel class</label><input name="classes" required></div>
        <div class="field"><label>Travellers</label><input name="number_of_travels" type="number" min="1" required></div>
        <div class="field"><label>Budget</label><input name="budget" type="number" min="0" required></div>
        <div class="field"><label>Estimated expenses</label><input name="estimated_expenses" type="number" min="0" required></div>
        <div class="field"><label>Number of days</label><input name="number_of_days" type="number" min="1" required></div>
        <div class="field"><label>Start date</label><input name="start_date" type="date" required></div>
        <div class="field"><label>Travel style</label><input name="style" required></div>
      </div>
      <div><button class="button">Save changes</button> <button class="button subtle" type="button" data-cancel-edit>Cancel</button></div>
    </form>
    <section class="itinerary-section">
      <div class="itinerary-heading"><div><p class="eyebrow">THE DAY-BY-DAY PLAN</p><h2>Trip itinerary</h2></div><div><p id="itinerary-meta">Loading itinerary…</p><a class="button subtle" id="album-link" href="/pages/album.html" style="display: none;" hidden>Open trip album</a></div></div>
      <div id="days" class="grid"><div class="empty">Loading day plans…</div></div>
    </section>
    <section id="trip-reviews" class="panel" style="margin-top: 2rem;">
      <div class="empty">Loading reviews…</div>
    </section>
  </main>
  <script src="/config.js"></script>
  <script type="module" src="/src/pages/trip-details.js"></script>
</body>
</html>
