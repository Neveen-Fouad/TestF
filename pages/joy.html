<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Joy | Journovo</title>
  <link rel="stylesheet" href="/src/pages/joy.css">
</head>
<body>
  <div data-navigation></div>
  <main class="page joy-page">
    <div class="eyebrow">JOURNOVO AI</div>
    <h1>Chat with Joy</h1>
    <p class="lead">Your personal travel companion for practical, thoughtful advice. Trip creation is handled separately.</p>
    <section class="joy-shell" aria-labelledby="joy-title">
      <header class="joy-header">
        <div class="joy-avatar" aria-hidden="true">J</div>
        <div><h2 id="joy-title">Joy</h2><p><span class="status-dot" aria-hidden="true"></span>Travel companion</p></div>
        <span class="joy-header-note">Ask about destinations, planning, and local tips</span>
      </header>
      <div id="chat" class="chat" role="log" aria-live="polite" aria-label="Conversation with Joy"></div>
      <p id="joy-status" class="joy-status" role="status" hidden></p>
      <form id="joy-form" class="joy-composer">
        <label class="sr-only" for="joy-message">Message Joy</label>
        <input id="joy-message" name="message" required autocomplete="off" maxlength="1000" placeholder="What should I know before visiting Istanbul?">
        <button class="button" type="submit"><span>Send</span><span aria-hidden="true">→</span></button>
      </form>
      <p class="joy-hint">Joy can help with travel advice. Please don't share passwords or payment details.</p>
    </section>
  </main>
  <script src="/config.js"></script>
  <script type="module" src="/src/pages/joy.js"></script>
</body>
</html>
