<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Journovo</title><link rel="stylesheet" href="/src/pages/login.css"></head><body><div data-navigation></div><main class="page auth"><section class="panel"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new password</h1><form id="reset-form" class="form"><input name="token" type="hidden"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username" placeholder="you@example.com"></div><div class="field"><label>New password</label><div class="password-wrapper"><input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="8+ characters"><button type="button" class="password-toggle" aria-label="Show password" data-password-toggle><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="field"><label>Confirm new password</label><div class="password-wrapper"><input name="password_confirmation" type="password" minlength="8" required autocomplete="new-password" placeholder="Re-enter password"><button type="button" class="password-toggle" aria-label="Show password" data-password-toggle><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button class="button">Reset password</button></form></section></main><script src="/config.js"></script><script type="module" src="/src/pages/reset-password.js"></script></body></html>
