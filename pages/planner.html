<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan a trip | Journovo</title><link rel="stylesheet" href="/src/pages/planner.css"></head><body><div data-navigation></div><main class="page planner-page"><section class="planner-hero"><div><p class="eyebrow">PERSONALISED PLANNING</p><h1>Give Joy the shape of your perfect trip.</h1><p>Start with the essentials. Your plan can change as your ideas do.</p></div><div class="planner-orbit" aria-hidden="true">✦</div></section><form id="plan" class="panel plan-form"><div class="form-heading"><p class="eyebrow">YOUR TRIP DETAILS</p><h2>Where are we going?</h2></div><div class="plan-grid"><div class="field"><label>Destination</label><input name="destination" required placeholder="e.g. Istanbul, Türkiye"></div><div class="field"><label>Travel style</label><select name="style"><option value="cultural">Cultural</option><option value="relaxed">Relaxed</option><option value="adventure">Adventure</option><option value="food">Food &amp; local life</option></select></div><div class="field"><label>Start date</label><input name="start_date" type="date" required></div><div class="field"><label>End date</label><input name="end_date" type="date" required></div><div class="field"><label>Travellers</label><input name="number_of_travels" type="number" min="1" max="20" value="2" required></div><div class="field"><label>Budget (USD)</label><input name="budget" type="number" min="100" step="1" placeholder="1500" required></div><div class="field"><label>Estimated extras (USD)</label><input name="estimated_expenses" type="number" min="0" step="1" value="0"></div></div><button class="button">Create my trip plan</button></form><div id="plan-result" aria-live="polite"></div></main><script type="module" src="/src/pages/planner.js"></script></body></html>
