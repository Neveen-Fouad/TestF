<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip album | Journovo</title><link rel="stylesheet" href="/src/pages/album.css"></head><body><div data-navigation></div><main class="page split album-page"><div data-sidebar></div><section><header class="album-heading"><div><p class="eyebrow">TRIP TIME CAPSULE</p><h1>Keep the little moments close.</h1><p>Photos, notes and voice memories from the trips that matter.</p></div></header><div class="album-layout"><aside class="panel album-compose"><div class="field"><label for="album-trip">Choose a trip</label><select id="album-trip"><option>Loading your trips…</option></select></div><form id="memory-form" class="form"><div class="memory-types"><button type="button" class="active" data-type="note">✎<span>Note</span></button><button type="button" data-type="photo">▧<span>Photo</span></button><button type="button" data-type="voice">◉<span>Voice</span></button></div><input name="type" value="note" type="hidden"><div class="field" id="note-field"><label>Your note</label><textarea name="note" rows="5" placeholder="What made this moment special?"></textarea></div><div class="field" id="file-field" hidden><label>Upload memory</label><input name="file" type="file" accept="image/*,audio/*"></div><div class="field"><label>Caption <small>(optional)</small></label><input name="caption" maxlength="255" placeholder="A short title for this moment"></div><button class="button">Add to album</button></form></aside><section class="panel album-content"><div id="album-summary" class="album-summary"><span>✦</span><p>Select a trip to open its album.</p></div><div id="album-memories" class="memory-grid"><div class="empty">Loading trip memories…</div></div></section></div></section></main><script src="/config.js"></script><script type="module" src="/src/pages/album.js"></script></body></html>
