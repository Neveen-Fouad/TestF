<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Journovo</title><link rel="stylesheet" href="/src/pages/profile.css"></head><body><div data-navigation></div><main class="page split profile-page"><div data-sidebar></div><section><header class="page-heading"><p class="eyebrow">ACCOUNT SETTINGS</p><h1>Your profile, your way.</h1><p>Keep your details current and your account secure.</p></header><div class="profile-layout"><form id="profile-form" class="panel form"><div class="panel-heading"><div><p class="eyebrow">PERSONAL DETAILS</p><h2>About you</h2></div><span id="profile-status" class="form-status"></span></div><div class="form-grid"><div class="field"><label>First name</label><input name="first_name" autocomplete="given-name" required></div><div class="field"><label>Last name</label><input name="last_name" autocomplete="family-name" required></div><div class="field form-wide"><label>Email address</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Phone</label><input name="phone" type="tel" autocomplete="tel"></div><div class="field"><label>Birth date</label><input name="birth_date" type="date"></div></div><button class="button">Save profile</button></form><form id="password-form" class="panel form"><div class="panel-heading"><div><p class="eyebrow">SECURITY</p><h2>Change password</h2></div></div><p class="muted">Use a password you do not use on another site.</p><div class="field"><label>Current password</label><input name="current_password" type="password" autocomplete="current-password" required></div><div class="field"><label>New password</label><input name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>Confirm new password</label><input name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required></div><button class="button subtle">Update password</button></form></div></section></main><script type="module" src="/src/pages/profile.js"></script></body></html>
