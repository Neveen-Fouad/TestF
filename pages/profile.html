<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Journovo</title><link rel="stylesheet" href="/src/pages/profile.css"></head><body><div data-navigation></div><main class="page split profile-page"><div data-sidebar></div><section><header class="page-heading"><p class="eyebrow">ACCOUNT</p><h1>Your profile, your way.</h1><p>Review your details and open a form only when you want to make a change.</p></header><article class="panel"><div class="panel-heading"><div><p class="eyebrow">PERSONAL DETAILS</p><h2 id="profile-name">Traveller</h2></div><button class="button subtle" type="button" data-toggle="profile-form">Edit info</button></div><div id="profile-summary" class="profile-summary"></div><form id="profile-form" class="form" hidden><div class="form-grid"><div class="field"><label>First name</label><input name="first_name" required></div><div class="field"><label>Last name</label><input name="last_name" required></div><div class="field form-wide"><label>Email</label><input name="email" type="email" readonly aria-readonly="true"></div><div class="field"><label>Phone</label><input name="phone" type="tel"></div><div class="field"><label>Birth date</label><input name="birth_date" type="date"></div></div><button class="button">Save profile</button></form></article><article class="panel security-card"><div class="panel-heading"><div><p class="eyebrow">SECURITY</p><h2>Password</h2><p class="muted">Update your password securely.</p></div><button class="button subtle" type="button" data-toggle="password-form">Change password</button></div><form id="password-form" class="form" hidden><div class="field"><label>Current password</label><input name="current_password" type="password" required></div><div class="field"><label>New password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Confirm new password</label><input name="password_confirmation" type="password" minlength="8" required></div><button class="button">Update password</button></form></article></section></main><script src="/config.js"></script><script type="module" src="/src/pages/profile.js"></script></body></html>
