<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Journovo</title><link rel="stylesheet" href="/src/pages/contact.css"></head><body><div data-navigation></div><main class="page"><div class="eyebrow">SUPPORT</div><h1>Contact Journovo</h1><p class="lead">Have a question or feedback? We'd love to hear from you.</p><form id="contact-form" class="panel form"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Subject / Title</label><input name="title" required maxlength="255" placeholder="e.g. Issue with my booking"></div><div class="field"><label>Phone</label><input name="phone" type="tel" required maxlength="20" placeholder="+1 555 000 0000"></div><div class="field"><label>Message</label><textarea name="description" required rows="6" maxlength="1000" placeholder="Describe your issue or question…"></textarea></div><button class="button">Send message</button></form></main><script type="module" src="/src/pages/contact.js"></script></body></html>
