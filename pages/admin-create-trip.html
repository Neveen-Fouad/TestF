<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create trip | Journovo</title><link rel="stylesheet" href="/src/pages/admin.css"></head><body data-admin-page="create-trip"><main class="page split admin-shell"><div data-admin-sidebar></div><section><p class="eyebrow">ADMINISTRATION</p><h1>Create a trip manually</h1><form id="trip-create-form" class="panel form"><div class="form-grid"><div class="field"><label>Destination</label><input name="destination" required></div><div class="field"><label>Start date</label><input name="start_date" type="date" required></div><div class="field"><label>End date</label><input name="end_date" type="date" required></div><div class="field"><label>Number of days</label><input name="number_of_days" type="number" min="1" required></div><div class="field"><label>Budget</label><input name="budget" type="number" min="100" required></div><div class="field"><label>Estimated expenses</label><input name="estimated_expenses" type="number" min="0" value="0" required></div><div class="field"><label>Travellers</label><input name="number_of_travels" type="number" min="1" value="1" required></div><div class="field"><label>Travel style</label><input name="style" required placeholder="Culture, adventure, relaxation…"></div></div><button class="button">Create trip</button></form><div id="admin-content"></div></section></main><script src="/config.js"></script><script type="module" src="/src/pages/admin.js"></script></body></html>
