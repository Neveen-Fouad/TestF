<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flights | Journovo</title>
  <link rel="stylesheet" href="/src/pages/flights.css">
</head>
<body>
  <div data-navigation></div>
  <main class="page search-page">
    <p class="eyebrow">FLIGHTS</p>
    <h1>Find the way there.</h1>
    <p class="lead">Type each city or airport and Journovo will resolve it through the live airport API.</p>
    <form id="flight-search" class="panel search-form">
      <div class="search-grid">
        <div class="field">
          <label>Origin airport</label>
          <input name="origin_query" required minlength="2" placeholder="e.g. Cairo">
          <small data-airport-status="origin"></small>
          <input name="originSkyId" type="hidden">
          <input name="originEntityId" type="hidden">
        </div>
        <div class="field">
          <label>Destination airport</label>
          <input name="destination_query" required minlength="2" placeholder="e.g. Istanbul">
          <small data-airport-status="destination"></small>
          <input name="destinationSkyId" type="hidden">
          <input name="destinationEntityId" type="hidden">
        </div>
        <div class="field">
          <label>Departure date</label>
          <input name="date" type="date" required>
        </div>
        <div class="field">
          <label>Travellers</label>
          <input name="adults" type="number" min="1" max="9" value="1">
        </div>
        <div class="field">
          <label>Cabin</label>
          <select name="cabinClass">
            <option value="economy">Economy</option>
            <option value="premium_economy">Premium economy</option>
            <option value="business">Business</option>
            <option value="first">First</option>
          </select>
        </div>
        <div class="field">
          <label>Sort by</label>
          <select name="sortBy">
            <option value="best">Best</option>
            <option value="price_high">Price</option>
            <option value="fastest">Fastest</option>
          </select>
        </div>
        <div class="field">
          <label>Currency</label>
          <input name="currency" value="USD" maxlength="3">
        </div>
      </div>
      <button class="button" type="submit">Search flights</button>
    </form>
    <div id="flights" class="results">
      <div class="empty">Add your route to load live flight options.</div>
    </div>
  </main>
  <script src="/config.js"></script>
  <script type="module" src="/src/pages/flights.js"></script>
</body>
</html>
