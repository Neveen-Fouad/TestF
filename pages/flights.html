<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flights | Journovo</title><link rel="stylesheet" href="/src/pages/flights.css"></head><body><div data-navigation></div><main class="page search-page"><p class="eyebrow">FLIGHTS</p><h1>Find the way there.</h1><p class="lead">Search flights with the live backend’s city, date and traveller fields.</p><form id="flight-search" class="panel search-form"><div class="search-grid"><div class="field"><label>Origin city</label><input name="origin_city" required placeholder="Cairo"></div><div class="field"><label>Destination city</label><input name="destination_city" required placeholder="Istanbul"></div><div class="field"><label>Departure date</label><input name="departure_date" type="date" required></div><div class="field"><label>Return date <small>(optional)</small></label><input name="return_date" type="date"></div><div class="field"><label>Travellers</label><input name="travelers" type="number" min="1" max="9" value="1"></div><div class="field"><label>Cabin</label><select name="cabin_class"><option value="economy">Economy</option><option value="premium_economy">Premium economy</option><option value="business">Business</option><option value="first">First</option></select></div><div class="field"><label>Sort by</label><select name="sort_by"><option value="best">Best</option><option value="price_high">Price</option><option value="fastest">Fastest</option></select></div></div><button class="button">Search flights</button></form><div id="flights" class="results"><div class="empty">Add your route to load live flight options.</div></div></main><script type="module" src="/src/pages/flights.js"></script></body></html>
